include:
  - project: 'tnoff-projects/github-workflows'
    ref: f67fcdcca917548baa7a350797d3e3004f570d7d
    file: '/gitlab/renovate.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: f67fcdcca917548baa7a350797d3e3004f570d7d
    file: '/gitlab/discord-notify.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: f67fcdcca917548baa7a350797d3e3004f570d7d
    file: '/gitlab/branch-cleanup.yml'

stages:
  - renovate

default:
  # Ride out ci-pool cold-starts / node churn (warm ci floor + autoscaler
  # scale-down grace live in terraform nodes_v2_ci and docker-apps
  # cluster-autoscaler). These `when:` classes are infra-side failures, never
  # `script_failure`, so a failing test/lint is never silently retried. GitLab
  # caps retry:max at 2 (= 3 total attempts).
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  tags:
    - self-hosted

renovate:
  extends: .renovate
  stage: renovate
  # The shared .renovate template defaults GITHUB_COM_TOKEN to $GITHUB_COM_TOKEN,
  # which is defined at no scope for this project, so GitLab expands it to an
  # empty string. Renovate presents that empty token to github.com, is rejected
  # (401), and its terraform manager falls back to anonymous github.com for the
  # release lookups it must do for a .tf repo (hashicorp/terraform core +
  # providers). Point it at the group-level GITHUB_BOT_TOKEN instead — the same
  # override the other tnoff-projects repos already carry.
  variables:
    GITHUB_COM_TOKEN: $GITHUB_BOT_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Scheduled prune of stale automation branches (bump/* + renovate/*) left
# behind because remove_source_branch only fires on MR merge, not on the
# API-driven close of a superseded bump/renovate MR. Rides the weekly
# schedule and reuses RENOVATE_TOKEN. See the github-workflows
# .branch-cleanup template and docs runbooks/branch-cleanup.md.
branch-cleanup:
  extends: .branch-cleanup
  stage: renovate
  variables:
    CLEANUP_AGE_DAYS: "30"
    DRY_RUN: "false"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
